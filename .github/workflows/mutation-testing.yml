---
name: Mutation Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Stryker v10 removed `--since`; scope PR runs with an explicit --mutate list.
      # Exclusions mirror stryker.config.mjs (tests, d.ts, Next.js entrypoints).
      - name: Run Stryker on Changed Files
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' \
              | grep -vE '\.(test|spec)\.tsx?$|/__tests__/|\.d\.ts$|(^|/)app/.*(layout|page|loading|error|not-found|template|route)\.tsx$|(^|/)middleware\.ts$' \
              || true)
            if [ -z "$FILES" ]; then
              echo "No mutable source files changed in this PR; skipping."
              exit 0
            fi
            echo "Mutating:"; echo "$FILES"
            npx stryker run --mutate "$(echo "$FILES" | paste -sd, -)"
          else
            npx stryker run
          fi

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
